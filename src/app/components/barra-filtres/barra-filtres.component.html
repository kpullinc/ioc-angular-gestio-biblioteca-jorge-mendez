<form class="filtres" #formulariFiltres="ngForm" (ngSubmit)="aplicaFiltres()" aria-label="Filtres del catàleg">
  <div class="camp">
    <label for="text">Text de cerca</label>
    <input id="text" name="text" type="search" [(ngModel)]="filtres.text" #campText="ngModel" minlength="3" placeholder="Opcional, mínim 3 caràcters" aria-describedby="text-ajuda text-error" />
    <span id="text-ajuda" class="ajuda">Opcional: si escriviu text, ha de tenir 3 caràcters com a mínim. Podeu filtrar només per categoria.
    </span>
    <!--Si el text es invalid, mostra l'avís en vermell-->
    @if (campText.invalid && (campText.dirty || campText.touched)) {
      <strong id="text-error" class="error" role="alert">
        Necessitem com a mínim 3 caràcter per fer la cerca.
      </strong>
    }

  </div>

  <div class="camp">
    <label for="categoria">Gènere</label>
    <select id="categoria" name="categoria" [(ngModel)]="filtres.genere">
      @for (genere of generes; track genere) {
        <option [ngValue]="genere">{{ genere }}</option>
      }
    </select>
  </div>

  <div class="accions">
    <button type="submit" [disabled]="formulariFiltres.invalid">
      Aplicar filtres
    </button>
    <button type="button" class="secundari" (click)="restableixFiltres()">
      Restablir
    </button>
  </div>
</form>
