<article class="targeta" [class.seleccionada]="seleccionada">
  <header class="targeta-capcalera">
    <app-etiqueta-element [genere]="element.genere" [disponible]="element.disponible ?? false">
    </app-etiqueta-element>
    S <time [attr.datetime]="element.dataPublicacio">
      {{ element.dataPublicacio | date:'dd/MM/yyyy' }}
    </time>
  </header>

  <h3>{{ element.titol }}</h3>
  <p>{{ element.descripcio }}</p>

  <p class="valoracio">
    ★
    {{ element.valoracioLectors }}/5
  </p>

  <button type="button" (click)="avisaSeleccio()">Veure detall</button>
</article>
